plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.macallan.dadmedicine.alarm'
version = '0.1.0'

android {
  namespace "com.macallan.dadmedicine.alarm"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':expo-notifications')
}
